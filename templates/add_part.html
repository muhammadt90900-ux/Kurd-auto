<!-- templates/add_part.html -->
{% extends "base.html" %}
{% block content %}
<h2>زیادکردنی پارچەی نوێ</h2>
<form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label>ناوی پارچە</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>مۆدێلی ئۆتۆمبێل</label>
        <input type="text" name="car_model" class="form-control">
    </div>
    <div class="mb-3">
        <label>وەسف</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label>نرخ (دینار)</label>
        <input type="number" step="0.01" name="price" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>وێنەی پارچە (باربکە)</label>
        <input type="file" name="image_file" class="form-control" accept="image/*">
        <small class="text-muted">پێشنیار دەکرێت وێنەی ڕوون</small>
    </div>
    <div class="mb-3">
        <label>یان لینکی وێنە</label>
        <input type="url" name="image_url" class="form-control" placeholder="https://...">
        <small class="text-muted">ئەگەر وێنە بار ناکەیت، دەتوانیت لینکێک دابنێیت</small>
    </div>
    <button type="submit" class="btn btn-primary">تۆمارکردن</button>
</form>
{% endblock %}
