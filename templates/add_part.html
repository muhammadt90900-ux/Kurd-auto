{% extends "base.html" %}
{% block content %}
<h2>زیادکردنی پارچەی نوێ</h2>
<form method="POST">
    <div class="mb-3">
        <label>ناوی پارچە</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>مۆدێلی ئۆتۆمبێل</label>
        <input type="text" name="car_model" class="form-control">
    </div>
    <div class="mb-3">
        <label>وەسف</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label>نرخ (دینار)</label>
        <input type="number" step="0.01" name="price" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>لینکی وێنە (ئارەزوومەندانە)</label>
        <input type="url" name="image_url" class="form-control" placeholder="https://...">
    </div>
    <button type="submit" class="btn btn-primary">تۆمارکردن</button>
</form>
{% endblock %}
