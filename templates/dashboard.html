{% extends "base.html" %}
{% block content %}
<h2>داشبۆردی فرۆشیار - {{ current_user.username }}</h2>
<a href="{{ url_for('add_part') }}" class="btn btn-success mb-3">+ پارچەی نوێ</a>
<div class="row">
    {% for part in parts %}
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h5>{{ part.name }}</h5>
                <p>{{ "{:,.0f}".format(part.price) }} دینار</p>
                <a href="{{ url_for('part_detail', part_id=part.id) }}" class="btn btn-sm btn-info">بینین</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
