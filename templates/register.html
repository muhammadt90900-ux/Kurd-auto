{% extends "base.html" %}
{% block content %}
<h2>تۆماربوون</h2>
<form method="POST">
    <div class="mb-3">
        <label>ناوی بەکارهێنەر</label>
        <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>وشەی نهێنی</label>
        <input type="password" name="password" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>جۆری هەژمار</label>
        <select name="user_type" class="form-select" required>
            <option value="buyer">کڕیار</option>
            <option value="seller">فرۆشیار</option>
        </select>
    </div>
    <button type="submit" class="btn btn-success">تۆماربوون</button>
</form>
{% endblock %}
